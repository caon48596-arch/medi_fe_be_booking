version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: emedical-postgres
    environment:
      POSTGRES_DB: emedical_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: emedical-redis
    ports:
      - "6379:6379"